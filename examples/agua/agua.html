const svg = document.querySelector(".lb-lesson svg");
const jet = svg.querySelector('[data-part="jet"]');
const fill = svg.querySelector('[data-part="fill"]');
const pump = [...svg.querySelectorAll('[data-id="pump"]')];
const rain = [[[24,72,117.60000000000001],[24,72,41.6]],[[40,28.8,117.60000000000001],[40,28.8,80]],[[64,48,117.60000000000001],[64,48,41.6]],[[48,96,117.60000000000001],[48,96,5.2]],[[80,120,117.60000000000001],[80,120,5.2]],[[28,136,117.60000000000001],[28,136,5.2]],[[96,88,117.60000000000001],[96,88,5.2]],[[68,152,117.60000000000001],[68,152,5.2]]].map((pts) => lesson.route(pts, { token: "#w-drop", gap: 26, speed: 90 }));
const stream = lesson.route([[44,17.6,61.400000000000006],[44,32,61.400000000000006],[44,33.6,42.2],[44,48,42.2],[44,49.6,23.000000000000004],[44,64,23.000000000000004],[44,65.6,5.2],[44,88,5.2]], { token: "#w-clean", gap: 9, speed: 26 });
const muddy = lesson.route([[64,128,5.2],[108.8,92,5.2],[113.6,92,5.8],[146,92,5.8],[147,92,23.400000000000002],[164,92,23.400000000000002],[181,92,23.400000000000002],[200,92,23.400000000000002],[208,92,23.400000000000002]], { token: "#w-mud", gap: 14, speed: 24 });
const clean = lesson.route([[208,92,23.400000000000002],[221,92,23.400000000000002],[224,92,5.8],[236,92,5.8],[236,144,5.8],[264,144,5.8],[264,144,84]], { token: "#w-clean", gap: 14, speed: 30 });
const down = lesson.route([[264,165,84],[264,171.2,84],[264,171.2,3.2]], { token: "#w-clean", gap: 12, speed: 30 });
const main = lesson.route([[264,176.4,3.2],[264,176.4,-9.600000000000001],[448,176.4,-9.600000000000001]], { token: "#w-clean", gap: 14, speed: 34 });
const home = [[[384,176.4,-9.600000000000001],[384,168.4,-9.600000000000001]], [[384,146.4,3.2],[384,146.4,25.6],[384,152.4,25.6]]].map((pts) => lesson.route(pts, { token: "#w-drop", gap: 7, speed: 30 }));
const pour = lesson.route([[384,152.4,20.6],[384,152.4,10.8]], { token: "#w-drop", gap: 5, speed: 60 });
const state = { rain: true, open: false, rainy: 0, flow: 0, town: 0, bucket: 0, drip: 0 };
const RESERVOIR = [8,72,112,176];

const toggleRain = () => { if (lesson.step >= 1) state.rain = !state.rain; };
const toggleTap = () => { if (lesson.step >= 5) state.open = !state.open; };
lesson.onStep((step) => {
  if (step === 1) state.rain = true;
  if (step === 5) { state.open = true; state.bucket = 0; }
  if (step < 5) state.open = false;
});
const rainButton = lesson.button("rain", toggleRain, () => (state.rain ? "☀️ Que pare de llover" : "🌧️ Que llueva"));
const tapButton = lesson.button("tap", toggleTap, () => (state.open ? "✋ Cerrar el grifo" : "🚰 Abrir el grifo"));
lesson.click('[data-id="cloud"]', toggleRain);
lesson.click('[data-id="tap"]', toggleTap);
lesson.click('[data-id="bucket"]', () => { if (!state.open) state.bucket = 0; });
lesson.key("l", toggleRain);
lesson.key("g", toggleTap);

lesson.every((dt) => {
  const s = lesson.step;
  state.rainy = lesson.ease(state.rainy, s >= 1 && state.rain ? 1 : 0, dt, 0.5);
  state.town = lesson.ease(state.town, s >= 2 ? 1 : 0, dt, 0.5);
  state.flow = lesson.ease(state.flow, s >= 5 && state.open ? 1 : 0, dt, 0.25);
  if (state.flow > 0.5) state.bucket = Math.min(1, state.bucket + dt * 0.12);
  rain.forEach((route) => (route.level = state.rainy));

  lesson.fx.level("reservoir", s >= 1 ? 1 : 0);
  state.drip += dt * state.rainy * 5;
  while (state.drip > 1) {
    state.drip -= 1;
    lesson.fx.ripple("reservoir", RESERVOIR[0] + 6 + Math.random() * (RESERVOIR[2] - RESERVOIR[0] - 12), RESERVOIR[1] + 6 + Math.random() * (RESERVOIR[3] - RESERVOIR[1] - 12));
  }

  muddy.level = state.town;
  clean.level = s >= 3 ? state.town : 0;
  down.level = s >= 3 ? state.town : 0;
  main.level = s >= 4 ? state.town : 0;
  home.forEach((route) => (route.level = state.flow));
  pour.level = state.flow;

  fill.style.opacity = (state.bucket * 0.95).toFixed(3);
  pump.forEach((node) => node.toggleAttribute("data-on", s >= 3));
  rainButton.disabled = s < 1;
  tapButton.disabled = s < 5;

});

lesson.readout(() => {
  const s = lesson.step;
  return [
    s >= 1 ? (state.rain ? "🌧️ llueve" : "☀️ no llueve") : "",
    s >= 5 ? (state.open ? "🚰 grifo abierto" : "🚰 grifo cerrado") : "",
    s >= 5 ? (state.bucket >= 1 ? "🪣 ¡cubo lleno!" : state.bucket > 0.05 ? "🪣 llenando el cubo" : "🪣 cubo vacío") : "",
  ].filter(Boolean).join("  ·  ");
});
