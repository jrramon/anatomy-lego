</div></main><script type="module">const AZIMUTH = 45;

á siempre (es la presión del agua contra el fondo del casco), aunque las piezas azules solo se mueven mientras el agua se desplaza. El balanceo va a cámara lenta.","night":null},{"say":"La trabajadora carga cajas. Cada caja pesa, y el barco baja un poquito para apartar más agua.","ask":"¿Cuántas cajas lleva? ¿Está el barco más hundido que antes?","note":"Cada caja hunde el casco 2,8 mm: a escala LEGO pesa unos 20 g, lo que pesan 20 cm³ de agua. Los barcos de verdad llevan pintada la línea de carga (la marca Plimsoll): el agua nunca debe pasar de ella.","night":null},{"say":"¡Una caja más! El barco baja tanto que el agua entra por el borde… ¡y se hunde!","ask":"¿Qué podríamos hacer para que no se hunda?","note":"Con cinco cajas, para flotar tendría que apartar más agua de la que cabe en su casco. El agua entra por arriba, llena el casco, y el barco ya solo aparta su acero y sus cajas. Por eso, curiosamente, al hundirse el nivel del puerto baja un poco.","night":null},{"say":"¡Ahora te toca a ti! Pon y quita cajas, empuja el barco o tira piedras.","ask":"¿Cuántas cajas puede llevar sin hundirse?","note":"También puedes pulsar la grúa para sacar y meter el barco y ver bajar y subir el agua. Hemos simplificado: un barco real se inclina si la carga no va centrada, y las olas y el viento también cuentan. Los barcos de verdad llevan la carga muy por debajo de su límite.","night":null}],"projection":{"origin":[261.4509099004138,96.32332910614141],"scale":1.7988693434441874,"azimuth":55,"elevation":30}});

  flowIn.forEach((route) => (route.level = s >= 3 ? back : 0));
  pour.forEach((route) => (route.level = state.mode === "flood" ? 1 : 0));

  loadButton.disabled = s < 5 || state.n >= 5 || state.mode !== "float";
  unloadButton.disabled = s < 5 || (sunkish() ? state.mode !== "sunk" : state.n <= 0 || state.mode !== "float");
  const moving = Math.abs(state.v) > 0.02 || Math.abs(state.z - restZ()) > 0.02;
  if (state.mode === "float" && !moving) state.v = 0;
  return busy || state.mode === "lower" || state.mode === "lift" || state.mode === "flood" || state.mode === "sink" || (state.mode === "float" && moving) || Math.abs(state.Lshow - state.L) > 0.01 || state.drops.some((d) => d > 0) || state.fade < 1 || Math.abs(state.hz - (state.attached ? state.z - ZB0 + HOOK : ARM_HOOK)) > 0.05 || state.flow !== 0;
});

lesson.readout(() => {
  const s = lesson.step;
  if (s < 1) return "🌊 agua tranquila";
  const rise = state.Lshow - L0;
  const where = { hang: "🏗️ colgado de la grúa", lower: "🏗️ bajando al agua", lift: "🏗️ subiendo", float: "⛵ flota", flood: "💦 ¡le entra agua!", sink: "🫧 se hunde", sunk: "⚓ en el fondo" }[state.mode];
  return [
    s >= 2 ? where : "🪨 la piedra se hunde",
    s >= 5 ? "📦 " + state.n + (state.n === 1 ? " caja" : " cajas") : "",
    state.flow > 0.05 ? "🌊 el agua se aparta" : state.flow < -0.05 ? "🌊 el agua vuelve" : s >= 3 && rise > 0.2 ? "🌊 el agua ha subido " + rise.toFixed(1).replace(".", ",") + " mm" : s >= 3 ? "🌊 agua tranquila" : "",
  ].filter(Boolean).join("  ·  ");
});

lesson.start();</script></body></html>
