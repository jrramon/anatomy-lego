name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: Rebuild and audit the lessons
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Regression tests
        run: node --test scripts/*.test.mjs

      - name: Farola (LEGO)
        run: node examples/farola/build.mjs --audit

      - name: Agua del grifo (LEGO)
        run: node examples/agua/build.mjs --audit

      - name: Avión (LEGO)
        run: node examples/avion/build.mjs --audit

      - name: Motor (LEGO)
        run: node examples/motor/build.mjs --audit

      - name: Día y noche (LEGO)
        run: node examples/dia-noche/build.mjs --audit

      - name: Central de vapor (LEGO)
        run: node examples/vapor/build.mjs --audit

      - name: Committed pages are unchanged
        run: |
          git status --short
          git diff --stat --exit-code
          test -z "$(git status --porcelain)"
